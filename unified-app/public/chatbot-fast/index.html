<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chatbot Fast</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#0a1018;
  --panel:#121b27;
  --panel2:#182435;
  --line:#273449;
  --text:#edf3ff;
  --muted:#9eb0c9;
  --accent:#59c2ff;
  --ok:#6ddb9a;
  --danger:#ff7f7f;
}
html,body{height:100%;margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:radial-gradient(circle at 20% -10%,#193153 0%,#0a1018 60%);color:var(--text)}
.wrap{max-width:980px;margin:0 auto;padding:22px 16px 30px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.title{font-size:22px;font-weight:700;letter-spacing:.2px}
.title span{color:var(--accent)}
.back{color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:7px 12px;background:rgba(24,36,53,.5)}
.panel{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:14px;padding:14px}
.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px}
textarea{width:100%;min-height:120px;resize:vertical;background:#0f1724;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:15px;line-height:1.45;outline:none}
textarea:focus{border-color:var(--accent)}
.row{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
button{border:none;border-radius:10px;background:var(--accent);color:#00121f;padding:10px 14px;font-weight:700;cursor:pointer}
button.secondary{background:transparent;color:var(--muted);border:1px solid var(--line)}
button.secondary:hover{color:var(--text);border-color:var(--accent)}
button:disabled{opacity:.6;cursor:not-allowed}
.hint{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.card{background:#0f1724;border:1px solid var(--line);border-radius:12px;padding:12px;min-height:170px}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.card h3{margin:0;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}
.copy-btn{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;transition:color .15s,border-color .15s}
.copy-btn:hover{color:var(--accent);border-color:var(--accent)}
.copy-btn.copied{color:var(--ok);border-color:var(--ok)}
.out{white-space:pre-wrap;line-height:1.5;font-size:15px}
.status{margin-top:10px;font-size:13px;color:var(--muted)}
.status.ok{color:var(--ok)}
.status.err{color:var(--danger)}
.audio-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.audio-btn{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:13px;font-weight:600;cursor:pointer;transition:color .15s,border-color .15s}
.audio-btn:hover{color:var(--accent);border-color:var(--accent)}
.audio-btn:disabled{opacity:.5;cursor:not-allowed}
.pron-panel{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px}
.pron-phrase{font-size:16px;font-weight:600;color:var(--text);margin-bottom:10px;padding:10px;background:#0f1724;border:1px solid var(--line);border-radius:8px}
.pron-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
.score-badges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.score-chip{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--muted)}
.score-main{background:var(--accent) !important;color:#00121f !important;border-color:var(--accent) !important;font-weight:700}
.score-section{margin-bottom:8px;font-size:14px;color:var(--text)}
.score-section h4{margin:4px 0;font-size:13px;color:var(--muted)}
.score-list{margin:4px 0 0 0;padding-left:20px;color:var(--muted)}
.score-list li{margin-bottom:3px}
select.pron-select{background:#0f1724;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;outline:none}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="title">⚡ Chatbot <span>Fast</span></div>
      <a class="back" href="/">Volver al Hub</a>
    </div>

    <div class="panel">
      <div class="label">Mensaje del usuario</div>
      <textarea id="input" placeholder="Escribe en inglés o español..."></textarea>
      <div class="row">
        <button id="send">Mejorar y traducir</button>
        <button id="clear" class="secondary" type="button">Limpiar</button>
        <div class="hint">Salida rápida: inglés mejorado + traducción al castellano.</div>
      </div>
      <div id="status" class="status"></div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="card-header">
          <h3>English Improved</h3>
          <button class="copy-btn" id="copy-en">📋 Copiar</button>
        </div>
        <div id="improved" class="out"></div>
        <div class="audio-row" id="audio-row" style="display:none">
          <button class="audio-btn" id="btn-uk">🔊 UK</button>
          <button class="audio-btn" id="btn-us">🔊 US</button>
          <button class="audio-btn" id="btn-mic">🎙 Check Pronunciation</button>
        </div>
      </div>
      <div class="card">
        <div class="card-header">
          <h3>Traducción al Castellano</h3>
          <button class="copy-btn" id="copy-es">📋 Copiar</button>
        </div>
        <div id="translation" class="out"></div>
      </div>
    </div>

    <div class="pron-panel" id="pron-panel" style="display:none">
      <div class="label">Evaluación de Pronunciación</div>
      <div class="pron-phrase" id="pron-phrase"></div>
      <div class="pron-row">
        <label style="font-size:13px;color:var(--muted)">Acento:</label>
        <select id="pron-accent" class="pron-select">
          <option value="american">American 🇺🇸</option>
          <option value="british">British 🇬🇧</option>
        </select>
        <button class="secondary" type="button" id="pron-replay">🔊 Reproducir</button>
        <button class="secondary" type="button" id="pron-record">🎙 Grabar y verificar</button>
      </div>
      <div id="pron-status" class="status" style="margin-top:8px"></div>
      <div id="pron-result" style="display:none;margin-top:12px"></div>
    </div>
  </div>

<script>
const $ = (id) => document.getElementById(id);
const input = $('input');
const send = $('send');
const clearBtn = $('clear');
const improved = $('improved');
const translation = $('translation');
const statusEl = $('status');

function esc(s) { return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ---- Voice / Audio ----
function waitForVoices(ms = 1200) {
  return new Promise((resolve) => {
    const list = speechSynthesis.getVoices();
    if (list.length) return resolve(list);
    const tid = setTimeout(() => { speechSynthesis.onvoiceschanged = null; resolve(speechSynthesis.getVoices()); }, ms);
    speechSynthesis.onvoiceschanged = () => { clearTimeout(tid); speechSynthesis.onvoiceschanged = null; resolve(speechSynthesis.getVoices()); };
  });
}

function pickVoice(accent, voices) {
  const lang = accent === 'british' ? 'en-GB' : 'en-US';
  return voices.find(v => v.lang === lang)
      || voices.find(v => v.lang.startsWith(accent === 'british' ? 'en-GB' : 'en-US'))
      || voices.find(v => v.lang.startsWith('en'))
      || null;
}

async function speakPhrase(text, accent = 'british') {
  if (!text) return;
  const voices = await waitForVoices();
  const utter = new SpeechSynthesisUtterance(text);
  const voice = pickVoice(accent, voices);
  if (voice) utter.voice = voice;
  utter.lang = accent === 'british' ? 'en-GB' : 'en-US';
  utter.rate = 0.95;
  utter.pitch = 1.0;
  speechSynthesis.cancel();
  speechSynthesis.speak(utter);
}

// ---- Pronunciation ----
let activeRecognition = null;
let pronLoading = false;

function getSpeechRecognitionCtor() {
  return window.SpeechRecognition || window.webkitSpeechRecognition || null;
}

function setPronStatus(text, cls = '') {
  const el = $('pron-status');
  el.className = `status ${cls}`.trim();
  el.textContent = text;
}

function renderPronResult(r) {
  const el = $('pron-result');
  if (!r) { el.style.display = 'none'; el.innerHTML = ''; return; }
  const highlights = Array.isArray(r.highlights) ? r.highlights : [];
  const issues = Array.isArray(r.issues) ? r.issues : [];
  const advice = Array.isArray(r.advice) ? r.advice : [];
  el.style.display = '';
  el.innerHTML = `
    <div class="score-badges">
      <span class="score-chip score-main">Overall: ${Number(r.overall_score||0)}/100</span>
      <span class="score-chip">Accuracy: ${Number(r.accuracy_score||0)}/100</span>
      <span class="score-chip">Fluency: ${Number(r.fluency_score||0)}/100</span>
      <span class="score-chip">Verdict: ${esc(r.verdict||'n/a')}</span>
    </div>
    <div class="score-section"><strong>Transcript:</strong> ${esc(r.spoken_transcript||'-')}</div>
    <div class="score-section"><h4>Highlights</h4><ul class="score-list">${highlights.map(x=>`<li>${esc(x)}</li>`).join('')||'<li>-</li>'}</ul></div>
    <div class="score-section"><h4>Issues</h4><ul class="score-list">${issues.map(x=>`<li>${esc(x)}</li>`).join('')||'<li>-</li>'}</ul></div>
    <div class="score-section"><h4>Advice</h4><ul class="score-list">${advice.map(x=>`<li>${esc(x)}</li>`).join('')||'<li>-</li>'}</ul></div>
    <div class="score-section"><strong>Next try:</strong> ${esc(r.next_try||$('pron-phrase').textContent)}</div>
  `;
}

function showPronPanel(phrase) {
  $('pron-phrase').textContent = phrase;
  $('pron-panel').style.display = '';
  setPronStatus('Lee la frase y pulsa Grabar y verificar.');
  renderPronResult(null);
}

async function startPronunciationCapture() {
  const SpeechRecognition = getSpeechRecognitionCtor();
  if (!SpeechRecognition) {
    setPronStatus('Speech recognition no está soportado en este navegador.', 'err');
    return;
  }
  const phrase = $('pron-phrase').textContent.trim();
  if (!phrase) return;

  pronLoading = true;
  $('pron-record').disabled = true;
  setPronStatus('Escuchando... pronuncia la frase ahora.');
  renderPronResult(null);

  const accent = $('pron-accent').value;
  const recognition = new SpeechRecognition();
  activeRecognition = recognition;
  recognition.lang = accent === 'british' ? 'en-GB' : 'en-US';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onresult = async (event) => {
    const transcript = String(event?.results?.[0]?.[0]?.transcript || '').trim();
    setPronStatus(transcript ? `Capturado: "${transcript}". Verificando con LLM...` : 'No se captó ninguna voz. Inténtalo de nuevo.');
    if (!transcript) {
      pronLoading = false;
      $('pron-record').disabled = false;
      return;
    }
    try {
      const res = await fetch('/api/chatbot/pronunciation/check', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phrase, transcript, accent }),
      });
      const data = await res.json().catch(() => ({}));
      renderPronResult(data.review || null);
      setPronStatus('Revisión completada.', 'ok');
    } catch (e) {
      setPronStatus(`Error de verificación: ${e.message}`, 'err');
    } finally {
      pronLoading = false;
      $('pron-record').disabled = false;
    }
  };

  recognition.onerror = (event) => {
    pronLoading = false;
    $('pron-record').disabled = false;
    setPronStatus(`Error de micrófono: ${event?.error || 'unknown'}`, 'err');
  };

  recognition.onend = () => {
    activeRecognition = null;
    if (pronLoading) {
      pronLoading = false;
      if (!$('pron-result').innerHTML) setPronStatus('No se capturó audio. Inténtalo de nuevo.');
      $('pron-record').disabled = false;
    }
  };

  try {
    recognition.start();
  } catch (e) {
    pronLoading = false;
    $('pron-record').disabled = false;
    setPronStatus(`No se pudo iniciar el micrófono: ${e.message}`, 'err');
  }
}

function setStatus(text, cls='') {
  statusEl.className = `status ${cls}`.trim();
  statusEl.textContent = text;
}

async function run() {
  const text = input.value.trim();
  if (!text) {
    setStatus('Escribe un mensaje para procesar.', 'err');
    return;
  }

  send.disabled = true;
  setStatus('Procesando...');
  improved.textContent = '';
  translation.textContent = '';

  try {
    const res = await fetch('/api/chatbot-fast/improve', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    });

    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.error) {
      throw new Error(data.error || `HTTP ${res.status}`);
    }

    const improvedText = String(data.improved_en || '');
    improved.textContent = improvedText;
    translation.textContent = String(data.translation_es || '');
    const saved = data.saved_to_phrase_bank ?? 0;
    const savedMsg = saved > 0 ? ` · 💾 Guardado en Phrase Bank` : '';
    setStatus(`Listo.${savedMsg}`, 'ok');

    // wire audio buttons
    $('audio-row').style.display = '';
    $('btn-uk').onclick = () => speakPhrase(improvedText, 'british');
    $('btn-us').onclick = () => speakPhrase(improvedText, 'american');
    $('btn-mic').onclick = () => showPronPanel(improvedText);
  } catch (err) {
    setStatus(`Error: ${err.message}`, 'err');
  } finally {
    send.disabled = false;
  }
}

function clearAll() {
  input.value = '';
  improved.textContent = '';
  translation.textContent = '';
  $('audio-row').style.display = 'none';
  $('pron-panel').style.display = 'none';
  renderPronResult(null);
  if (activeRecognition) { try { activeRecognition.stop(); } catch(_){} activeRecognition = null; }
  setStatus('Contenido limpiado.');
  input.focus();
}

function makeCopyBtn(btnId, sourceId) {
  $(`copy-${btnId}`).addEventListener('click', async () => {
    const text = $(sourceId).textContent.trim();
    if (!text) return;
    try {
      await navigator.clipboard.writeText(text);
      const btn = $(`copy-${btnId}`);
      btn.textContent = '✓ Copiado';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = '📋 Copiar'; btn.classList.remove('copied'); }, 1800);
    } catch (_) {}
  });
}
makeCopyBtn('en', 'improved');
makeCopyBtn('es', 'translation');

send.addEventListener('click', run);
clearBtn.addEventListener('click', clearAll);
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) run();
});
$('pron-replay').addEventListener('click', () => {
  const phrase = $('pron-phrase').textContent.trim();
  const accent = $('pron-accent').value;
  speakPhrase(phrase, accent);
});
$('pron-record').addEventListener('click', startPronunciationCapture);
</script>
</body>
</html>
