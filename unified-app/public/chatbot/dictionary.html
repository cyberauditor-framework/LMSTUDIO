<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-store" />
<title>Dictionary — English Chatbot</title>
<style>
:root {
  --bg: #0e1117;
  --panel: #1a1f2b;
  --panel2: #232a38;
  --text: #eef3ff;
  --muted: #9aa6bc;
  --accent: #58a6ff;
  --border: #344055;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(1200px 600px at 20% -10%, #1f2f55 0%, #0e1117 45%), var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', system-ui, sans-serif;
}
.hub-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 16px;
  border-bottom: 1px solid #212a3a;
  background: #0d1117;
  font-size: 12px;
  color: #8b949e;
}
.hub-bar a { color: var(--accent); text-decoration: none; font-weight: 600; }
.hub-bar a:hover { opacity: .85; }
.container {
  max-width: 1100px;
  margin: 16px auto;
  padding: 0 16px 22px;
}
.card {
  border: 1px solid var(--border);
  border-radius: 12px;
  background: linear-gradient(180deg, #1a2335 0%, #151b28 100%);
  padding: 14px;
}
.title { margin: 0 0 6px; font-size: 26px; }
.subtitle { margin: 0 0 14px; color: var(--muted); }
.controls {
  display: grid;
  grid-template-columns: 210px 1fr auto;
  gap: 8px;
}
.controls select,
.controls input {
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--panel2);
  color: var(--text);
  padding: 10px 12px;
  font-size: 14px;
  outline: none;
}
.controls input:focus,
.controls select:focus { border-color: var(--accent); }
.btn {
  border: 1px solid #3d7aed;
  border-radius: 10px;
  background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 100%);
  color: #fff;
  padding: 10px 14px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
.btn:disabled { opacity: .55; cursor: not-allowed; }
.helper { margin-top: 10px; color: var(--muted); font-size: 12px; }
.result {
  margin-top: 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: #0e1522;
  padding: 12px;
}
.word-line {
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
}
.word { font-size: 28px; font-weight: 700; }
.phonetic { color: #bdd6ff; }
.meta { color: var(--muted); font-size: 13px; }
.section { margin-top: 10px; }
.section h3 { margin: 0 0 6px; font-size: 13px; color: #c7dcff; }
.section ul { margin: 0; padding-left: 18px; }
.section li { margin: 2px 0; }
.examples {
  display: grid;
  gap: 8px;
}
.ex {
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px;
  background: var(--panel);
}
.ex .a { font-size: 13px; }
.ex .b { font-size: 13px; color: var(--muted); margin-top: 2px; }
.err {
  margin-top: 10px;
  border: 1px solid #7f1d1d;
  background: #3a1414;
  color: #fecaca;
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 13px;
}
@media (max-width: 820px) {
  .controls { grid-template-columns: 1fr; }
  .btn { width: 100%; }
  .word { font-size: 24px; }
}
</style>
</head>
<body>
<div class="hub-bar">
  <a href="/">LM Studio Hub</a>
  <span>/</span>
  <a href="/app/chatbot">English Chatbot</a>
  <span>/</span>
  <a href="/app/chatbot/phrase-bank.html">Phrase Bank</a>
  <span>/</span>
  <span>Dictionary</span>
  <span>/</span>
  <a href="/app/chatbot/verbs.html">Verb Engine</a>
</div>

<div class="container">
  <section class="card">
    <h1 class="title">Dictionary</h1>
    <p class="subtitle">Look up terms in English-English, English-Spanish, or Spanish-English with definitions, translations, phrasal verbs, common expressions, and slang.</p>

    <div class="controls">
      <select id="mode">
        <option value="en-en">English -> English</option>
        <option value="en-es">English -> Spanish</option>
        <option value="es-en">Spanish -> English</option>
      </select>
      <input id="term" type="text" placeholder="Type a word or short phrase..." />
      <button id="lookupBtn" class="btn" type="button">Lookup</button>
    </div>
    <div class="helper">Tip: Keep queries short (single words or short expressions).</div>

    <div id="error" class="err" hidden></div>
    <div id="result" class="result" hidden></div>
  </section>
</div>

<script>
async function readJsonResponse(res, contextLabel) {
  const raw = await res.text();
  try {
    return JSON.parse(raw);
  } catch (_) {
    const where = res?.url ? ` (${res.url})` : '';
    const looksHtml = /^<!DOCTYPE\s+html|^<html/i.test(String(raw || '').trim());
    if (looksHtml) throw new Error(`${contextLabel}: server returned HTML instead of JSON${where}.`);
    throw new Error(`${contextLabel}: invalid JSON response (HTTP ${res.status})${where}.`);
  }
}

function buildApiBaseCandidates() {
  const bases = [];
  const push = (u) => {
    if (!u || bases.includes(u)) return;
    bases.push(u.replace(/\/$/, ''));
  };
  push(window.location.origin);
  for (let p = 3000; p <= 3010; p++) {
    push(`http://localhost:${p}`);
    push(`http://127.0.0.1:${p}`);
  }
  return bases;
}

async function postJsonWithFallback(path, payload, contextLabel) {
  const candidates = buildApiBaseCandidates();
  let lastErr = null;
  for (const base of candidates) {
    const url = `${base}${path}`;
    try {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await readJsonResponse(res, contextLabel);
      if (!res.ok || data.error) {
        throw new Error(data?.error || `${contextLabel} failed (HTTP ${res.status}) at ${base}`);
      }
      return data;
    } catch (err) {
      lastErr = err;
    }
  }
  throw lastErr || new Error(`${contextLabel}: no API base responded with JSON.`);
}

function esc(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function showError(message) {
  const box = document.getElementById('error');
  box.hidden = false;
  box.textContent = message;
}

function clearError() {
  const box = document.getElementById('error');
  box.hidden = true;
  box.textContent = '';
}

function renderResult(r) {
  const box = document.getElementById('result');
  const defs = Array.isArray(r.definitions) ? r.definitions : [];
  const syns = Array.isArray(r.synonyms) ? r.synonyms : [];
  const ants = Array.isArray(r.antonyms) ? r.antonyms : [];
  const pvs = Array.isArray(r.phrasal_verbs) ? r.phrasal_verbs : [];
  const expr = Array.isArray(r.common_expressions) ? r.common_expressions : [];
  const slang = Array.isArray(r.slang) ? r.slang : [];
  const altTranslations = Array.isArray(r.alternative_translations) ? r.alternative_translations : [];
  const rel = Array.isArray(r.related) ? r.related : [];
  const notes = Array.isArray(r.notes) ? r.notes : [];
  const examples = Array.isArray(r.examples) ? r.examples : [];

  box.innerHTML = `
    <div class="word-line">
      <div class="word">${esc(r.term || '-')}</div>
      ${r.phonetic ? `<div class="phonetic">${esc(r.phonetic)}</div>` : ''}
      <div class="meta">${esc((r.part_of_speech || 'n/a'))} | ${esc((r.mode || ''))} | confidence ${Number(r.confidence || 0)}/100</div>
    </div>
    ${r.meaning ? `<div class="section"><h3>Meaning</h3><div>${esc(r.meaning)}</div></div>` : ''}
    ${(r.main_translation || r.translation) ? `<div class="section"><h3>Main Spanish Translation</h3><div>${esc(r.main_translation || r.translation)}</div></div>` : ''}
    <div class="section"><h3>Alternative Translations</h3><ul>${altTranslations.map(x => `<li>${esc(x)}</li>`).join('') || '<li>-</li>'}</ul></div>
    <div class="section"><h3>Definitions</h3><ul>${defs.map(x => `<li>${esc(x)}</li>`).join('') || '<li>-</li>'}</ul></div>
    <div class="section"><h3>Examples</h3>
      <div class="examples">${examples.map(ex => `<div class="ex"><div class="a">${esc(ex.source || '')}</div><div class="b">${esc(ex.target || '')}</div></div>`).join('') || '<div class="ex"><div class="a">-</div></div>'}</div>
    </div>
    <div class="section"><h3>Synonyms</h3><ul>${syns.map(x => `<li>${esc(x)}</li>`).join('') || '<li>-</li>'}</ul></div>
    <div class="section"><h3>Antonyms</h3><ul>${ants.map(x => `<li>${esc(x)}</li>`).join('') || '<li>-</li>'}</ul></div>
    <div class="section"><h3>Phrasal Verbs</h3><ul>${pvs.map(x => `<li>${esc(x)}</li>`).join('') || '<li>-</li>'}</ul></div>
    <div class="section"><h3>Common Expressions</h3><ul>${expr.map(x => `<li>${esc(x)}</li>`).join('') || '<li>-</li>'}</ul></div>
    <div class="section"><h3>Slang</h3><ul>${slang.map(x => `<li>${esc(x)}</li>`).join('') || '<li>-</li>'}</ul></div>
    <div class="section"><h3>Related</h3><ul>${rel.map(x => `<li>${esc(x)}</li>`).join('') || '<li>-</li>'}</ul></div>
    <div class="section"><h3>Notes</h3><ul>${notes.map(x => `<li>${esc(x)}</li>`).join('') || '<li>-</li>'}</ul></div>
  `;
  box.hidden = false;
}

async function lookup() {
  clearError();
  const btn = document.getElementById('lookupBtn');
  const mode = document.getElementById('mode').value;
  const term = document.getElementById('term').value.trim();
  if (!term) {
    showError('Please enter a term.');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Looking up...';
  try {
    const data = await postJsonWithFallback('/api/chatbot/dictionary/lookup', { term, mode }, 'Dictionary lookup');
    renderResult(data.result || {});
  } catch (err) {
    showError(err.message || 'Lookup failed.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Lookup';
  }
}

document.getElementById('lookupBtn').addEventListener('click', lookup);
document.getElementById('term').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') lookup();
});
</script>
</body>
</html>
