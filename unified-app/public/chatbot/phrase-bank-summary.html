<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Phrase Bank Generation Report</title>
<style>
:root {
  --bg: #0e1117;
  --panel: #1a1f2b;
  --panel2: #232a38;
  --text: #eef3ff;
  --muted: #9aa6bc;
  --accent: #58a6ff;
  --ok: #21c55d;
  --border: #344055;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Segoe UI', system-ui, sans-serif;
  color: var(--text);
  background: radial-gradient(1200px 600px at 20% -10%, #1f2f55 0%, #0e1117 45%), var(--bg);
}
.hub-bar {
  display:flex; align-items:center; gap:10px; padding:8px 16px;
  border-bottom:1px solid #212a3a; background:#0d1117;
  font-size:12px; color:#8b949e;
}
.hub-bar a { color: var(--accent); text-decoration:none; font-weight:600; }
.hub-bar a:hover { opacity:.85; }
.container {
  max-width: 1200px;
  margin: 20px auto;
  padding: 0 16px 24px;
}
.card {
  border:1px solid var(--border);
  border-radius:12px;
  background:linear-gradient(180deg, #1a2335 0%, #151b28 100%);
  padding:14px;
  margin-bottom:12px;
}
.card h2 {
  margin:0 0 10px;
  font-size:14px;
  color:#c7dcff;
}
.stats {
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap:10px;
}
.stat {
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--panel);
  padding:10px;
}
.stat .label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
.stat .value { margin-top:4px; font-size:20px; font-weight:700; }
.stat .value.ok { color: var(--ok); }
.summary-box {
  border:1px solid var(--border);
  border-radius:10px;
  background:#0e1522;
  padding:10px 12px;
  max-height:380px;
  overflow:auto;
}
.summary-box pre {
  margin:0;
  white-space:pre-wrap;
  min-width:900px;
  font-family: Consolas, 'Courier New', monospace;
  font-size:12px;
  line-height:1.55;
  color:var(--text);
}
.table-wrap {
  border:1px solid var(--border);
  border-radius:10px;
  overflow:auto;
}
table {
  width:100%;
  min-width: 900px;
  border-collapse:collapse;
  font-size:12px;
}
th, td {
  border-bottom:1px solid var(--border);
  padding:8px 10px;
  vertical-align:top;
}
th { background: var(--panel2); color: #c7dcff; text-align:left; }
tr:last-child td { border-bottom:none; }
.empty { color: var(--muted); }
@media (max-width: 760px) {
  .summary-box pre { min-width: 700px; }
}
</style>
</head>
<body>
<div class="hub-bar">
  <a href="/">LM Studio Hub</a>
  <span>/</span>
  <a href="/app/chatbot">English Chatbot</a>
  <span>/</span>
  <a href="/app/chatbot/phrase-bank.html">Phrase Bank</a>
  <span>/</span>
  <span>Generation Report</span>
</div>

<div class="container">
  <div class="card">
    <h2>Last Generation Processing Status</h2>
    <div class="stats" id="stats"></div>
  </div>

  <div class="card">
    <h2>Last AI Generation Summary (full)</h2>
    <div class="summary-box"><pre id="summary">No summary available.</pre></div>
  </div>

  <div class="card">
    <h2>Generated Entries (sample)</h2>
    <div class="table-wrap" id="entries-wrap"></div>
  </div>
</div>

<script>
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtDate(ts) {
  if (!ts) return 'n/a';
  try { return new Date(ts).toLocaleString(); } catch (_) { return 'n/a'; }
}

function loadReport() {
  const raw = localStorage.getItem('phrase_bank_last_generation');
  if (!raw) {
    document.getElementById('stats').innerHTML = '<div class="empty">No generation data stored yet. Trigger Generate in Phrase Bank first.</div>';
    document.getElementById('entries-wrap').innerHTML = '<div class="empty" style="padding:10px">No entries.</div>';
    return;
  }

  let data;
  try {
    data = JSON.parse(raw);
  } catch (_) {
    document.getElementById('stats').innerHTML = '<div class="empty">Stored generation payload is invalid.</div>';
    return;
  }

  const saved = Number(data.saved || 0);
  const total = Number(data.total || 0);
  const processed = saved === total && total > 0 ? 'YES' : 'PARTIAL';

  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="label">Saved</div><div class="value ok">${saved}</div></div>
    <div class="stat"><div class="label">Total Parsed</div><div class="value">${total}</div></div>
    <div class="stat"><div class="label">Processed & Saved</div><div class="value">${processed}</div></div>
    <div class="stat"><div class="label">Generated At</div><div class="value" style="font-size:14px">${esc(fmtDate(data.timestamp))}</div></div>
  `;

  document.getElementById('summary').textContent = data.summary || 'No summary returned in this run.';

  const entries = Array.isArray(data.generated) ? data.generated : [];
  if (!entries.length) {
    document.getElementById('entries-wrap').innerHTML = '<div class="empty" style="padding:10px">No generated entries were stored in the payload.</div>';
    return;
  }

  const rows = entries.slice(0, 120).map((e, idx) => `
    <tr>
      <td>${idx + 1}</td>
      <td>${esc(e.category)}</td>
      <td>${esc(e.phrase_en)}</td>
      <td>${esc(e.phrase_es)}</td>
      <td>${esc(e.level || e.style || '')}</td>
    </tr>
  `).join('');

  document.getElementById('entries-wrap').innerHTML = `
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Category</th>
          <th>English</th>
          <th>Spanish</th>
          <th>Style/Level</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

loadReport();
</script>
</body>
</html>
